plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'org.springframework.boot' version '2.7.18' 
    id 'io.spring.dependency-management' version '1.0.15.RELEASE' 
}

repositories {
    mavenCentral()
    // mavenLocal() // Uncomment if you are using local Maven dependencies
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local')
    }    
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/mifosx-gradle-local')
    }
}

ext {
    springBootVersion = '2.7.18'
}

dependencies {
    implementation 'com.telerivet:TelerivetAPIClient:1.7.0'
    implementation 'org.mifos:ph-ee-connector-common:1.8.1-gazelle'
    // implementation 'org.apache.camel.springboot:camel-spring-boot-starter:3.12.0'
    
    // It's generally recommended to let Spring Boot manage starter versions.
    // If you explicitly declare spring-boot-starter and spring-boot-starter-web,
    // they should ideally match your main springBootVersion.
    // However, Spring Boot 2.6.x is compatible with Java 17.
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web' // No version needed if managed by the plugin
    
    // implementation "org.springframework.boot:spring-boot-starter-actuator:$springBootVersion"
    implementation 'org.apache.camel:camel-endpointdsl:3.12.0'
    implementation 'org.apache.camel:camel-jetty:3.12.0'
    implementation 'org.apache.camel:camel-undertow:3.12.0'
    implementation 'org.apache.camel:camel-http:3.12.0'
    implementation 'org.apache.camel.springboot:camel-jackson-starter:3.12.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.1'
    implementation 'org.json:json:20211205'
    implementation 'io.camunda:zeebe-client-java:8.1.1'
    implementation 'com.auth0:java-jwt:3.18.3'
    implementation 'org.apache.velocity:velocity:1.7'
    implementation 'com.google.code.gson:gson:2.8.9'
    
    // For test dependencies, align with your Spring Boot version or ensure compatibility.
    // The version 2.2.2.RELEASE is quite old. It's best to let Spring Boot manage this.
    // testImplementation 'org.springframework.boot:spring-boot-starter-test' 
    // testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    // testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}

group = 'org.mifos'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}